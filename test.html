<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DigiDex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Rubik:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="page">
    <header class="site-header">
      <a class="portfolio-btn" href="#">&larr; Portfolio</a>
      <div>
        <p class="brand">DigiDex</p>
        <p class="tagline">Your pocket guide to the Digital World</p>
      </div>
      <span aria-hidden="true"></span>
    </header>

    <main class="device">
      <div class="device-head">
        <h1>DigiDex</h1>
        <div class="led" id="led" aria-hidden="true"></div>
      </div>

      <form class="search" id="searchForm" autocomplete="off">
        <input type="text" id="searchInput" aria-label="Digimon name or ID number"
          placeholder="Name or ID, like Agumon or 1">
        <button type="submit" class="btn">Scan</button>
      </form>

      <div class="bezel">
        <div class="lcd" aria-live="polite">
          <div id="message" class="message">Loading...</div>

          <div id="card" hidden>
            <div class="lcd-top">
              <span id="number"></span>
              <span id="level"></span>
            </div>
            <div class="portrait">
              <img id="image" alt="">
            </div>
            <h2 id="name"></h2>
            <dl class="info">
              <div>
                <dt>Type</dt>
                <dd id="type"></dd>
              </div>
              <div>
                <dt>Attribute</dt>
                <dd id="attribute"></dd>
              </div>
              <div>
                <dt>Released</dt>
                <dd id="release"></dd>
              </div>
            </dl>
            <p class="desc" id="desc"></p>
          </div>
        </div>
      </div>

      <div class="browse">
        <button type="button" class="btn" id="prev" aria-label="Previous Digimon" disabled>Previous</button>
        <span class="count" id="count"></span>
        <button type="button" class="btn" id="next" aria-label="Next Digimon">Next</button>
      </div>
    </main>

    <footer class="site-footer">
      <p>Data provided by <a href="https://digi-api.com" target="_blank" rel="noopener">Digi-API</a></p>
      <p class="fine">Unofficial fan project. Digimon is &copy; Bandai / Toei Animation. &middot; <span
          id="year"></span></p>
    </footer>
  </div>

  <script>
    const API = 'https://digi-api.com/api/v1/digimon';
    const NETWORK_ERROR = 'Could not reach the Digimon API. Check your connection and try again.';

    let current = null;
    let token = 0;

    const $ = (id) => document.getElementById(id);
    const elMessage = $('message');
    const elCard = $('card');
    const elNumber = $('number');
    const elLevel = $('level');
    const elName = $('name');
    const elImage = $('image');
    const elType = $('type');
    const elAttribute = $('attribute');
    const elRelease = $('release');
    const elDesc = $('desc');
    const elCount = $('count');
    const elLed = $('led');
    const elInput = $('searchInput');
    const elPrev = $('prev');

    async function getJson(url) {
      const res = await fetch(url);
      if (res.status === 404) return null;
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    function joinNames(arr, key) {
      return (arr || []).map((x) => x[key]).filter(Boolean).join(', ');
    }

    function englishDescription(d) {
      const list = d.descriptions || [];
      const en = list.find((x) => x.language === 'en_us')
        || list.find((x) => (x.language || '').startsWith('en'));
      return en ? en.description : '';
    }

    function setLed(on) {
      elLed.classList.toggle('on', on);
    }

    function showMessage(text) {
      setLed(false);
      elCard.hidden = true;
      elMessage.hidden = false;
      elMessage.textContent = text;
    }

    function render(d) {
      current = d;
      elMessage.hidden = true;
      elCard.hidden = false;

      elNumber.textContent = 'No. ' + String(d.id).padStart(4, '0');
      elName.textContent = d.name;
      elLevel.textContent = d.levels && d.levels[0] ? d.levels[0].level : 'Unknown';
      elType.textContent = joinNames(d.types, 'type') || '—';
      elAttribute.textContent = joinNames(d.attributes, 'attribute') || '—';
      elRelease.textContent = d.releaseDate || '—';
      elDesc.textContent = englishDescription(d);
      elDesc.scrollTop = 0;
      elPrev.disabled = d.id <= 1;

      const src = d.images && d.images[0] ? d.images[0].href : '';
      elImage.alt = d.name;

      function reveal() {
        setLed(false);
        elImage.style.visibility = 'visible';
      }

      if (!src) {
        setLed(false);
        elImage.style.visibility = 'hidden';
        return;
      }
      if (elImage.getAttribute('src') === src) {
        reveal();
        return;
      }

      setLed(true);
      elImage.style.visibility = 'hidden';
      elImage.onload = reveal;
      elImage.onerror = () => {
        setLed(false);
        elImage.style.visibility = 'visible';
      };
      elImage.src = src;
    }

    async function findDigimon(q) {
      const d = await getJson(API + '/' + encodeURIComponent(q));
      if (d && d.id) return d;
      if (/^\d+$/.test(q)) return null;

      const list = await getJson(API + '?name=' + encodeURIComponent(q) + '&pageSize=1');
      const items = list ? (Array.isArray(list) ? list : list.content) : [];
      if (items && items[0] && items[0].id) {
        const found = await getJson(API + '/' + items[0].id);
        if (found && found.id) return found;
      }
      return null;
    }

    async function search() {
      const q = elInput.value.trim();
      if (!q) return;

      const mine = ++token;
      setLed(true);
      try {
        const d = await findDigimon(q);
        if (mine !== token) return;
        if (!d) {
          showMessage('No match for "' + q + '". Try another name, or an ID number.');
          return;
        }
        render(d);
      } catch (err) {
        if (mine === token) showMessage(NETWORK_ERROR);
      }
    }

    async function step(dir) {
      const startId = current ? current.id : 0;
      if (dir < 0 && startId <= 1) return;

      const mine = ++token;
      setLed(true);
      try {
        for (let i = 1; i <= 5; i++) {
          const id = startId + dir * i;
          if (id < 1) break;
          const d = await getJson(API + '/' + id);
          if (mine !== token) return;
          if (d && d.id) { render(d); return; }
        }
        if (dir > 0) {
          const first = await getJson(API + '/1');
          if (mine !== token) return;
          if (first && first.id) { render(first); return; }
        }
        setLed(false);
      } catch (err) {
        if (mine === token) showMessage(NETWORK_ERROR);
      }
    }

    $('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      search();
    });
    elPrev.addEventListener('click', () => step(-1));
    $('next').addEventListener('click', () => step(1));

    $('year').textContent = new Date().getFullYear();

    (async function init() {
      showMessage('Type a name or ID, then press Scan. Or use Next to browse.');
      try {
        const info = await getJson(API + '?pageSize=1');
        const total = info && info.pageable && info.pageable.totalElements;
        if (total) elCount.textContent = total.toLocaleString() + ' Digimon';
      } catch (err) { }
    })();
  </script>
</body>

</html>
